<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Leaflet</title>
    <meta
      name="description"
      content="A private reader for your EPUBs. Read together, remember more."

    <link rel="canonical" href="https://leaflet.chat/">

    <meta property="og:site_name" content="Leaflet">
    <meta property="og:title" content="Leaflet">

      property="og:description"
      content="A private reader for your EPUBs. Read together, remember more."

    <meta property="og:url" content="https://leaflet.chat/">
    <meta property="og:image" content="https://leaflet.chat/icons/icon-310.png">
    <meta name="twitter:card" content="summary">

      name="twitter:description"
      content="A private reader for your EPUBs. Read together, remember more."

    <meta name="twitter:image" content="https://leaflet.chat/icons/icon-310.png">
